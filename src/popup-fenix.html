<!DOCTYPE html>
<html id="uBO-popup-panel">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="css/themes/default.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/fa-icons.css">
<link rel="stylesheet" href="css/popup-fenix.css">
<link rel="icon" type="image/png" href="img/icon_64.png">
<title data-i18n="extName"></title>
</head>

<body class="loading" data-more="abc" aria-busy="true">
<div id="panes">
    <div id="main">
        <div id="sticky">
            <header id="brandBar">
                <div class="brandIdentity">
                    <img src="img/midori-shield.svg" alt="" width="32" height="32">
                    <div>
                        <strong data-i18n="extName"></strong>
                        <span data-i18n="midoriBrandTagline"></span>
                    </div>
                </div>
                <a class="brandSettings fa-icon" href="dashboard.html" target="uBODashboard" tabindex="0" data-i18n-title="popupTipDashboard">cogs</a>
            </header>
            <div class="siteBar">
                <div id="hostname"><span></span>&shy;<span>&nbsp;</span></div>
                <span class="liveStatus">
                    <span class="liveStatusIcons" aria-hidden="true">
                        <span class="liveIcon liveIconChecking fa-icon">spinner</span>
                        <span class="liveIcon liveIconActive fa-icon">check</span>
                        <span class="liveIcon liveIconPaused fa-icon">pause-circle-o</span>
                        <span class="liveIcon liveIconUnavailable fa-icon">question-circle</span>
                        <span class="liveIcon liveIconError fa-icon">exclamation-triangle</span>
                    </span>
                    <span id="midoriLiveStatusText" data-i18n="midoriCheckingProtection"></span>
                </span>
            </div>
        </div>
        <section id="midoriActivity" aria-live="polite">
            <div class="activityRing" aria-hidden="true">
                <div class="activityRingInner">
                    <strong id="midoriBlockedTotal">—</strong>
                    <span data-i18n="midoriBlockedShort"></span>
                </div>
            </div>
            <div class="activitySummary">
                <span data-i18n="midoriObservedActivity"></span>
                <strong id="midoriProtectionStatus" data-i18n="midoriCheckingProtection"></strong>
                <span id="midoriActivityDetail" data-i18n="midoriCheckingProtectionHint"></span>
            </div>
        </section>
        <div id="stickyTools">
            <div class="rulesetTools">
                <span id="saveRules" class="fa-icon" data-i18n-title="popupTipSaveRules">lock</span>
                <span id="revertRules" class="fa-icon" data-i18n-title="popupTipRevertRules">eraser</span>
            </div>
            <button id="switch" type="button" data-i18n-title="midoriCheckingProtection" disabled>
                <span class="fa-icon" aria-hidden="true">power-off</span>
                <span class="protectionCopy">
                    <strong id="midoriSwitchStatus" data-i18n="midoriCheckingProtection"></strong>
                    <span id="midoriSwitchHint" data-i18n="midoriCheckingProtectionHint"></span>
                </span>
            </button>
            <div class="rulesetTools">
                <span id="refresh" class="fa-icon" data-i18n-title="loggerReloadTip">refresh</span>
            </div>
        </div>
        <section id="midoriImpact" aria-labelledby="midoriImpactTitle">
            <h2 id="midoriImpactTitle" data-i18n="midoriPageImpact"></h2>
            <div class="impactGrid">
                <article class="impactCard">
                    <span class="impactIcon fa-icon" aria-hidden="true">download-alt</span>
                    <span><strong id="midoriDataSaved">—</strong><small data-i18n="midoriEstimatedDataSaved"></small></span>
                </article>
                <article class="impactCard">
                    <span class="impactIcon fa-icon" aria-hidden="true">bolt</span>
                    <span><strong id="midoriRequestReduction">—</strong><small data-i18n="midoriFewerRequests"></small></span>
                </article>
            </div>
        </section>
        <div id="midoriViewTabs" role="tablist" aria-label="Popup views">
            <button id="midoriActionsTab" type="button" role="tab" aria-selected="true" aria-controls="midoriActions" data-i18n="midoriOverview"></button>
            <button id="midoriStatisticsTab" type="button" role="tab" aria-selected="false" aria-controls="midoriStatistics" tabindex="-1" data-i18n="midoriDetails"></button>
        </div>
        <section id="midoriActions" class="midoriView" role="tabpanel" aria-labelledby="midoriActionsTab">
            <section id="midoriProtectionSummary" aria-labelledby="midoriProtectionSummaryTitle">
                <header>
                    <strong id="midoriProtectionSummaryTitle" data-i18n="midoriProtectionSummaryTitle"></strong>
                    <span data-i18n="midoriProtectionSummaryHint"></span>
                </header>
                <div class="protectionResults">
                    <article class="protectionResult">
                        <span class="resultIcon fa-icon" aria-hidden="true">filter</span>
                        <span class="resultCopy">
                            <strong data-i18n="midoriNetworkProtection"></strong>
                            <span data-i18n="midoriNetworkProtectionHint"></span>
                        </span>
                        <strong id="midoriNetworkBlocked" class="resultValue">—</strong>
                    </article>
                    <article class="protectionResult">
                        <span class="resultIcon fa-icon" aria-hidden="true">unlink</span>
                        <span class="resultCopy">
                            <strong data-i18n="midoriExternalDomains"></strong>
                            <span data-i18n="midoriExternalDomainsHint"></span>
                        </span>
                        <strong id="midoriBlockedDomainsQuick" class="resultValue">—</strong>
                    </article>
                    <article class="protectionResult">
                        <span class="resultIcon fa-icon" aria-hidden="true">eye-open</span>
                        <span class="resultCopy">
                            <strong data-i18n="midoriPageCleanup"></strong>
                            <span data-i18n="midoriPageCleanupHint"></span>
                        </span>
                        <strong id="midoriPageCleanupStatus" class="resultValue"></strong>
                    </article>
                    <article class="protectionResult">
                        <span class="resultIcon fa-icon" aria-hidden="true">ph-popups</span>
                        <span class="resultCopy">
                            <strong data-i18n="midoriPopupProtection"></strong>
                            <span data-i18n="midoriPopupProtectionHint"></span>
                        </span>
                        <strong id="midoriPopupBlocked" class="resultValue">—</strong>
                    </article>
                </div>
            </section>
            <header class="quickActionsHeader">
                <strong data-i18n="midoriQuickActions"></strong>
                <span data-i18n="midoriQuickActionsHint"></span>
            </header>
            <div id="basicTools" class="toolRibbon" data-more="c">
                <button type="button" id="gotoZap" class="fa-icon tool enabled needPick" data-more="d" data-i18n-title="popupTipZapper">bolt<span class="caption" data-i18n="popupTipZapper"></span></button>
                <button type="button" id="gotoPick" class="fa-icon tool enabled needPick" data-more="d" data-i18n-title="popupTipPicker">eye-dropper<span class="caption" data-i18n="popupTipPicker"></span></button>
                <button type="button" id="gotoReport" class="fa-icon tool enabled needPick" data-i18n-title="popupTipReport">comment-alt<span class="caption" data-i18n="popupTipReport"></span></button>
                <a href="logger-ui.html#_" class="fa-icon tool enabled" target="uBOLogger" tabindex="0" data-i18n-title="popupTipLog">list-alt<span class="caption" data-i18n="popupTipLog"></span></a>
                <a href="dashboard.html" class="fa-icon tool enabled" target="uBODashboard" tabindex="0" data-i18n-title="popupTipDashboard">cogs<span class="caption" data-i18n="popupTipDashboard"></span></a>
            </div>
            <div id="extraTools" class="toolRibbon" data-more="d">
                <span id="no-popups" class="hnSwitch tool enabled" role="button" aria-label tabindex="0" title><span class="fa-icon fa-icon-badged">ph-popups<svg class="nope" viewBox="0 0 20 20"><path d="M1,1 19,19M1,19 19,1" /></svg></span><span class="caption" data-i18n="popupNoPopups_v2"></span></span>
                <span id="no-large-media" class="hnSwitch tool enabled" role="button" aria-label tabindex="0" title><span class="fa-icon fa-icon-badged">film<svg class="nope" viewBox="0 0 20 20"><path d="M1,1 19,19M1,19 19,1" /></svg></span><span class="caption" data-i18n="popupNoLargeMedia_v2"></span></span>
                <span id="no-cosmetic-filtering" class="hnSwitch tool enabled" role="button" aria-label tabindex="0" title><span class="fa-icon fa-icon-badged">eye-slash<svg class="nope" viewBox="0 0 20 20"><path d="M1,1 19,19M1,19 19,1" /></svg></span><span class="caption" data-i18n="popupNoCosmeticFiltering_v2"></span></span>
                <span id="no-remote-fonts" class="hnSwitch tool enabled" role="button" aria-label tabindex="0" title><span class="fa-icon fa-icon-badged">ph-readermode-text-size<svg class="nope" viewBox="0 0 20 20"><path d="M1,1 19,19M1,19 19,1" /></svg></span><span class="caption" data-i18n="popupNoRemoteFonts_v2"></span></span>
                <span id="no-scripting" class="hnSwitch tool enabled" role="button" aria-label tabindex="0" title><span class="fa-icon fa-icon-badged">code<svg class="nope" viewBox="0 0 20 20"><path d="M1,1 19,19M1,19 19,1" /></svg></span><span class="caption" data-i18n="popupNoScripting_v2"></span></span>
            </div>
        </section>
        <section id="midoriStatistics" class="midoriView" role="tabpanel" aria-labelledby="midoriStatisticsTab" hidden>
            <div class="statisticsOverview">
                <div class="statisticsHeading">
                    <span data-i18n="midoriTechnicalSummary"></span>
                    <strong data-i18n="midoriBlockedByType"></strong>
                    <p data-i18n="midoriTechnicalBreakdownHint"></p>
                </div>
                <div class="statisticsKpis">
                    <article><strong id="midoriTechnicalBlockedValue">—</strong><span data-i18n="midoriRequestsBlocked"></span></article>
                    <article><strong id="midoriBlockedDomainsValue">—</strong><span data-i18n="midoriDomainsBlocked"></span></article>
                </div>
            </div>
            <div id="midoriBreakdown">
                <div class="breakdownRow" data-stat="media"><span class="statDot"></span><span data-i18n="midoriImagesMedia"></span><span class="statBar"><i></i></span><span class="statValue"><strong>0</strong><small>0%</small></span></div>
                <div class="breakdownRow" data-stat="script"><span class="statDot"></span><span data-i18n="midoriScripts"></span><span class="statBar"><i></i></span><span class="statValue"><strong>0</strong><small>0%</small></span></div>
                <div class="breakdownRow" data-stat="xhr"><span class="statDot"></span><span data-i18n="midoriDataRequests"></span><span class="statBar"><i></i></span><span class="statValue"><strong>0</strong><small>0%</small></span></div>
                <div class="breakdownRow" data-stat="frame"><span class="statDot"></span><span data-i18n="midoriFrames"></span><span class="statBar"><i></i></span><span class="statValue"><strong>0</strong><small>0%</small></span></div>
                <div class="breakdownRow" data-stat="other"><span class="statDot"></span><span data-i18n="midoriOtherRequests"></span><span class="statBar"><i></i></span><span class="statValue"><strong>0</strong><small>0%</small></span></div>
            </div>
            <div id="basicStats" data-more="a">
                <span data-i18n="popupBlockedOnThisPage_v2">_</span><span>_</span>
                <span data-i18n="popupDomainsConnected_v2">_</span><span>_</span>
                <span data-i18n="popupBlockedSinceInstall_v2" data-more="b">_</span><span data-more="b">_</span>
            </div>
        </section>
        <div id="unprocessedRequestWarning">
            <span data-i18n="unprocessedRequestTooltip"></span><span class="dismiss"><svg viewBox="0 0 20 20"><path d="M0,0 20,20M0,20 20,0" /></svg></span>
        </div>
        <hr data-more="f">
        <div class="itemRibbon" data-more="f">
            <span data-i18n="popupVersion"></span><span id="version"></span>
        </div>
        <hr data-more="g">
        <div id="moreOrLess" class="">
            <span id="moreButton">
                <span data-i18n="midoriAdvancedTools"></span>&emsp;<span class="fa-icon">angle-up</span>
            </span>
            <span id="lessButton">
                <span class="fa-icon">angle-up</span>&emsp;<span data-i18n="midoriSimpleView"></span>
            </span>
        </div>
    </div>
    <div id="firewall" data-more="e">
        <section><span class="fa-icon">filter</span><div class="filterExpressions"><div><span data-i18n="loggerRowFiltererBuiltinNot" data-expr="not">_</span><span data-i18n="loggerRowFiltererBuiltinBlocked" data-expr="blocked">_</span><span data-i18n="loggerRowFiltererBuiltinAllowed" data-expr="allowed">_</span></div><div><span data-i18n="loggerRowFiltererBuiltinNot" data-expr="not">_</span><span data-expr="script" data-i18n="popup3pScriptFilter">_</span><span data-expr="frame" data-i18n="popup3pFrameFilter">_</span></div></div></section>
        <div data-des="*" data-type="*"><span data-i18n="popupAnyRulePrompt">_</span><span data-src="/" data-i18n-title="popupTipGlobalRules"> </span><span data-src="." data-i18n-title="popupTipLocalRules"> </span></div>
        <div data-des="*" data-type="image"><span data-i18n="popupImageRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
        <div data-des="*" data-type="3p"><span data-i18n="popup3pAnyRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
        <div data-des="*" data-type="inline-script"><span data-i18n="popupInlineScriptRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
        <div data-des="*" data-type="1p-script"><span data-i18n="popup1pScriptRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
        <div data-des="*" data-type="3p-script"><span data-i18n="popup3pScriptRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
        <div data-des="*" data-type="3p-frame"><span data-i18n="popup3pFrameRulePrompt"></span><span data-src="/"> </span><span data-src="."> </span></div>
    </div>
    <div id="firewall-vspacer"></div>
</div>

<div id="templates" style="display: none">
    <div data-des="" data-type="*"><span><span><span></span></span><sub></sub></span><span data-src="/"></span><span data-src="."></span></div>
    <div id="actionSelector"><span id="dynaAllow"></span><span id="dynaNoop"></span><span id="dynaBlock"></span><span id="dynaCounts"></span></div>
    <div id="hotspotTip"></div>
    <div id="tooltip"></div>
</div>

<script src="lib/hsluv/hsluv-0.1.0.min.js"></script>

<script src="js/fa-icons.js" type="module"></script>
<script src="js/vapi.js"></script>
<script src="js/vapi-common.js"></script>
<script src="js/vapi-client.js"></script>
<script src="js/theme.js" type="module"></script>
<script src="js/i18n.js" type="module"></script>
<script src="js/popup-fenix.js" type="module"></script>

</body>

</html>
