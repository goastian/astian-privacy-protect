<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    // Detect theme and set data-theme before CSS renders
    (function(){
      var m = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(theme) {
        if (theme === 'system') theme = m.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      }
      try {
        chrome.storage.local.get('options', function(res) {
          var theme = (res && res.options && res.options.theme) || 'system';
          apply(theme);
          m.addEventListener('change', function() {
            chrome.storage.local.get('options', function(res2) {
              if (!res2 || !res2.options || res2.options.theme === 'system' || !res2.options.theme) {
                apply('system');
              }
            });
          });
        });
      } catch(e) {
        apply('system');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="popup.css">
  <title>Midori Privacy</title>
</head>
<body>
  <div id="popup">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4" stroke="var(--color-primary)" stroke-width="2.5"/>
        </svg>
        <span class="popup-title">MIDORI PRIVACY</span>
      </div>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg width="18" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/>
        </svg>
      </button>
    </header>

    <!-- Status section -->
    <div id="status-section" class="popup-status active">
      <div class="status-row">
        <div class="status-indicator">
          <div id="status-dot" class="status-dot active"></div>
          <div class="status-info">
            <div id="status-text" class="status-label">Protection Active</div>
            <div id="hostname" class="status-host">—</div>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-site" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Stats -->
    <div class="popup-stats">
      <div class="stat-block">
        <div class="stat-value stat-blocked" id="blocked-count">0</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block">
        <div class="stat-value stat-saved" id="saved-size">0</div>
        <div class="stat-label" id="saved-unit">KB Saved</div>
      </div>
    </div>

    <!-- Eco Dashboard -->
    <div id="eco-section" class="popup-section" style="background: var(--color-primary-bg); border-bottom: 1px solid var(--color-primary);">
      <div class="section-label" style="color: var(--color-primary-dark);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Eco Impact
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="text-align: center; flex: 1;">
          <div id="eco-energy" style="font-size: 0.9rem; font-weight: 800; color: var(--color-primary);">0 Wh</div>
          <div style="font-size: 0.6rem; color: var(--color-text-tertiary); text-transform: uppercase;">Energy</div>
        </div>
        <div style="width: 1px; height: 20px; background: var(--color-border);"></div>
        <div style="text-align: center; flex: 1;">
          <div id="eco-co2" style="font-size: 0.9rem; font-weight: 800; color: var(--color-primary);">0 g</div>
          <div style="font-size: 0.6rem; color: var(--color-text-tertiary); text-transform: uppercase;">CO2 Saved</div>
        </div>
      </div>
    </div>

    <!-- Protection Level Selector -->
    <div id="protection-level-section" class="popup-section">
      <div class="section-label">Shield Level</div>
      <div class="level-selector">
        <button class="level-btn" data-level="basic">Basic</button>
        <button class="level-btn active" data-level="standard">Standard</button>
        <button class="level-btn" data-level="strict">Strict</button>
      </div>
      <div id="level-status" class="level-status"></div>
    </div>

    <!-- Quick Category Toggles -->
    <div class="popup-section popup-categories">
      <button class="cat-chip active" data-cat="ads">
        <span class="cat-dot" style="background:var(--color-danger)"></span>
        Ads
      </button>
      <button class="cat-chip active" data-cat="trackers">
        <span class="cat-dot" style="background:var(--color-warning)"></span>
        Trackers
      </button>
      <button class="cat-chip active" data-cat="fingerprinting">
        <span class="cat-dot" style="background:var(--color-info)"></span>
        Privacy
      </button>
    </div>

    <!-- Pause Timer (visible only when paused) -->
    <div id="pause-section" class="popup-pause">
      <div class="pause-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="pause-label">Paused</span>
        <span id="pause-remaining" class="pause-time">00:00</span>
        <button id="btn-resume" class="btn btn-primary btn-sm">Resume</button>
      </div>
    </div>

    <!-- Pause quick options -->
    <div class="popup-section popup-pause-bar" style="display:flex; align-items:center; gap:6px;">
      <span class="section-label" style="margin-bottom:0; margin-right:auto;">Pause for:</span>
      <button class="pause-opt" data-minutes="5">5m</button>
      <button class="pause-opt" data-minutes="15">15m</button>
      <button class="pause-opt" data-minutes="30">30m</button>
      <button class="pause-opt" data-minutes="60">1h</button>
    </div>

    <!-- Live Request Stream -->
    <div id="live-stream" class="popup-live hidden">
      <div class="live-header">
        <span class="live-dot"></span>
        <span>Activity Stream</span>
      </div>
      <div id="live-items"></div>
    </div>

    <!-- Blocked requests list -->
    <div id="requests-list" class="popup-requests">
      <div id="empty-state" class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Clean browsing session</span>
      </div>

      <!-- Trackers group -->
      <div id="group-trackers" class="req-group hidden">
        <button class="group-header" data-group="trackers">
          <span class="group-dot" style="background:var(--color-warning)"></span>
          <span class="group-name">Trackers</span>
          <span id="count-trackers" class="badge badge-warning">0</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-trackers" class="group-items"></div>
      </div>

      <!-- Ads group -->
      <div id="group-ads" class="req-group hidden">
        <button class="group-header" data-group="ads">
          <span class="group-dot" style="background:var(--color-danger)"></span>
          <span class="group-name">Ads</span>
          <span id="count-ads" class="badge badge-danger">0</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-ads" class="group-items"></div>
      </div>

      <!-- Other group -->
      <div id="group-other" class="req-group hidden">
        <button class="group-header" data-group="other">
          <span class="group-dot" style="background:var(--color-text-tertiary)"></span>
          <span class="group-name">Other</span>
          <span id="count-other" class="badge badge-primary">0</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-other" class="group-items"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btn-report-fp" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3l-8.47-14.14a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Report False Positive
      </button>
      <button id="btn-report" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Open Dashboard
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
