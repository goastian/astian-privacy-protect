<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    // Detect system theme and set data-theme before CSS renders (no FOUC)
    (function(){var m=window.matchMedia('(prefers-color-scheme:dark)');function a(d){document.documentElement.setAttribute('data-theme',d.matches?'dark':'light')}a(m);m.addEventListener('change',a)})();
  </script>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="popup.css">
  <title>Midori Privacy</title>
</head>
<body>
  <div id="popup">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <svg class="logo" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="var(--color-primary)"/>
          <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="popup-title">Midori Privacy</span>
      </div>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Status section -->
    <div id="status-section" class="popup-status active">
      <div class="status-row">
        <div class="status-indicator">
          <div id="status-dot" class="status-dot active"></div>
          <div class="status-info">
            <div id="status-text" class="status-label">Protection Active</div>
            <div id="hostname" class="status-host">—</div>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-site" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Protection Level Selector -->
    <div id="protection-level-section" class="popup-section">
      <div class="section-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Protection Level
      </div>
      <div class="level-selector">
        <button class="level-btn" data-level="basic" title="Minimal blocking, best compatibility">Basic</button>
        <button class="level-btn active" data-level="standard" title="Recommended balance">Standard</button>
        <button class="level-btn" data-level="strict" title="Maximum protection">Strict</button>
      </div>
      <div id="level-status" class="level-status"></div>
    </div>

    <!-- Quick Category Toggles -->
    <div class="popup-section popup-categories">
      <button class="cat-chip active" data-cat="ads" title="Toggle ad blocking">
        <span class="cat-dot" style="background:var(--color-danger)"></span>
        Ads
      </button>
      <button class="cat-chip active" data-cat="trackers" title="Toggle tracker blocking">
        <span class="cat-dot" style="background:var(--color-warning)"></span>
        Trackers
      </button>
      <button class="cat-chip active" data-cat="fingerprinting" title="Toggle fingerprint protection">
        <span class="cat-dot" style="background:var(--color-info)"></span>
        Fingerprint
      </button>
    </div>

    <!-- Pause Timer (visible only when paused) -->
    <div id="pause-section" class="popup-pause">
      <div class="pause-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span class="pause-label">Paused</span>
        <span id="pause-remaining" class="pause-time">--:--</span>
        <button id="btn-resume" class="btn btn-primary btn-sm">Resume</button>
      </div>
    </div>

    <!-- Pause quick options -->
    <div class="popup-section popup-pause-bar">
      <span class="pause-bar-label">Pause:</span>
      <button class="pause-opt" data-minutes="5">5m</button>
      <button class="pause-opt" data-minutes="15">15m</button>
      <button class="pause-opt" data-minutes="30">30m</button>
      <button class="pause-opt" data-minutes="60">1h</button>
    </div>

    <!-- Stats -->
    <div class="popup-stats">
      <div class="stat-block">
        <div class="stat-value stat-blocked" id="blocked-count">0</div>
        <div class="stat-label">blocked</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block">
        <div class="stat-value stat-saved" id="saved-size">0</div>
        <div class="stat-label" id="saved-unit">KB saved</div>
      </div>
    </div>

    <!-- Live Request Stream -->
    <div id="live-stream" class="popup-live hidden">
      <div class="live-header">
        <span class="live-dot"></span>
        <span>Live blocked requests</span>
      </div>
      <div id="live-items"></div>
    </div>

    <!-- Blocked requests list -->
    <div id="requests-list" class="popup-requests">
      <div id="empty-state" class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>No activity on this page</span>
      </div>

      <!-- Trackers group -->
      <div id="group-trackers" class="req-group hidden">
        <button class="group-header" data-group="trackers">
          <span class="group-dot" style="background:var(--color-warning)"></span>
          <span class="group-name">Trackers</span>
          <span id="count-trackers" class="badge badge-warning">0</span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-trackers" class="group-items"></div>
      </div>

      <!-- Ads group -->
      <div id="group-ads" class="req-group hidden">
        <button class="group-header" data-group="ads">
          <span class="group-dot" style="background:var(--color-danger)"></span>
          <span class="group-name">Ads</span>
          <span id="count-ads" class="badge badge-danger">0</span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-ads" class="group-items"></div>
      </div>

      <!-- Other group -->
      <div id="group-other" class="req-group hidden">
        <button class="group-header" data-group="other">
          <span class="group-dot" style="background:var(--color-text-tertiary)"></span>
          <span class="group-name">Other</span>
          <span id="count-other" class="badge badge-primary">0</span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="list-other" class="group-items"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btn-report" class="footer-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Dashboard
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
